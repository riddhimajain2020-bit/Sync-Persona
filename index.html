<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan | SYNC Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="terminal">
        
        <div class="terminal-header">
            <div class="buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="title">aryan_persona_bot — bash</div>
        </div>

        <div id="history">
            <div class="line">
                <span class="bot-label">SYSTEM:</span> 
                <span class="typewriter">Booting SYNC OS... Done.</span>
            </div>
            <div class="line">
                <span class="bot-label">Aryan:</span> 
                <span>Hey! I'm Aryan. I use SYNC to handle my student life. Ask me anything or type 'help'.</span>
            </div>
        </div>

        <div class="input-area">
            <span class="prompt">➜</span>
            <span class="directory">~/persona</span>
            <input type="text" id="user-input" placeholder="type a question..." autofocus autocomplete="off">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
