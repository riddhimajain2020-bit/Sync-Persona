<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync AI | Persona Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">Sync</div>
            <div class="sub-header">
                <span class="icon">💬</span> AI ASSISTANT
            </div>
            <h1>Chat with Sync</h1>
            <p class="tagline">Ask anything — your AI assistant understands context and responds like a study buddy.</p>
        </header>

        <div id="chat-window">
            <div class="chat-wrapper" id="chat-wrapper">
                <div class="bot-profile">
                    <div class="avatar">S</div>
                    <div class="profile-info">
                        <span class="name">Sync AI</span>
                        <span class="status"><span class="dot"></span> Online now</span>
                    </div>
                    <span class="badge">Agentic AI</span>
                </div>

                <div id="messages">
                    <div class="message bot">
                        Hi Aryan! I'm your Sync AI. How can I help you manage your student life today?
                    </div>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <button onclick="sendQuick('Plan my study schedule')">Plan study schedule</button>
            <button onclick="sendQuick('Show my expenses')">Show my expenses</button>
            <button onclick="sendQuick('What deadlines do I have?')">What deadlines?</button>
            <button onclick="sendQuick('Set a bill reminder')">Set bill reminder</button>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Message Sync..." autocomplete="off">
            <button id="send-btn">➔</button>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item">🏠<span>Home</span></div>
            <div class="nav-item">📊<span>Dash</span></div>
            <div class="nav-item active">💬<span>AI Chat</span></div>
            <div class="nav-item">📅<span>Plan</span></div>
            <div class="nav-item">💰<span>Spend</span></div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
